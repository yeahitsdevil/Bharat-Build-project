services:
  server:
    build: ./server
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env
    environment:
      CLIENT_URL: http://localhost:5173
    volumes:
      - ~/.aws:/root/.aws:ro

  client:
    build:
      context: ./client
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000/api}
        VITE_AWS_LOCATION_API_KEY: ${VITE_AWS_LOCATION_API_KEY:-}
        VITE_AWS_LOCATION_REGION: ${VITE_AWS_LOCATION_REGION:-ap-south-1}
        VITE_AWS_MAP_STYLE: ${VITE_AWS_MAP_STYLE:-Standard}
        VITE_AWS_MAP_COLOR_SCHEME: ${VITE_AWS_MAP_COLOR_SCHEME:-Light}
        VITE_DEFAULT_SEARCH_RADIUS_KM: ${VITE_DEFAULT_SEARCH_RADIUS_KM:-5}
    ports:
      - "5173:80"
